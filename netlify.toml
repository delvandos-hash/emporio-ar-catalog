[build]
  publish = "."
  functions = "netlify/functions"

# Cabeçalhos de segurança aplicados a todas as respostas do site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"


[[redirects]]
  from = "/api/catalogo"
  to = "/.netlify/functions/get-catalog"
  status = 200

[[redirects]]
  from = "/api/stock-sync"
  to = "/.netlify/functions/stock-sync"
  status = 200

[[redirects]]
  from = "/api/roupas-stock"
  to = "/.netlify/functions/roupas-stock"
  status = 200

[[redirects]]
  from = "/api/dande-stock"
  to = "/.netlify/functions/dande-stock"
  status = 200

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/get-feed"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
