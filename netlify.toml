[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/catalogo"
  to = "/.netlify/functions/get-catalog"
  status = 200

[[redirects]]
  from = "/api/stock-sync"
  to = "/.netlify/functions/stock-sync"
  status = 200

[[redirects]]
  from = "/api/roupas-stock"
  to = "/.netlify/functions/roupas-stock"
  status = 200

[[redirects]]
  from = "/api/dande-stock"
  to = "/.netlify/functions/dande-stock"
  status = 200
  
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/get-feed"
  status = 200
