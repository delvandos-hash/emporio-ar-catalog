# A validação é disparada automaticamente quando a PR é aberta, atualizada ou reaberta.
name: Validar imagens públicas sem publicar catálogo

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/validate-public-images.mjs"
      - ".github/workflows/validate-public-images.yml"
      - "netlify/functions/product-image.mjs"
      - "scripts/public-image-url.mjs"

jobs:
  validate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar regras locais de URL e proxy de imagens
        run: node --test scripts/public-image-url.test.mjs scripts/product-image-function.test.mjs
      - name: Aguardar o Deploy Preview ficar disponível
        env:
          NETLIFY_PREVIEW_URL: ${{ format('https://deploy-preview-{0}--catalogoemporio.netlify.app', github.event.pull_request.number) }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$NETLIFY_PREVIEW_URL/" --output /dev/null; then
              echo "Deploy Preview disponível: $NETLIFY_PREVIEW_URL"
              exit 0
            fi
            echo "Prévia ainda indisponível (tentativa $attempt/12)."
            sleep 15
          done
          echo "Deploy Preview não ficou disponível. Publique a prévia no Netlify e reexecute este job."
          exit 1
      - name: Validar entrega de imagens do snapshot público na prévia
        run: node scripts/validate-public-images.mjs
        env:
          NETLIFY_PREVIEW_URL: ${{ format('https://deploy-preview-{0}--catalogoemporio.netlify.app', github.event.pull_request.number) }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
