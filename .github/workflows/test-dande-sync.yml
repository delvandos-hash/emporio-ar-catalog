name: Validacao isolada do sync (sem publicar catálogo)

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/sync-catalog.mjs"
      - ".github/workflows/test-dande-sync.yml"

permissions:
  contents: read

jobs:
  dry-run-sync:
    name: Sincronização real sem publicar no Gist
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe do sincronizador
        run: node --check scripts/sync-catalog.mjs
      - name: Executar sincronização em modo isolado
        run: node scripts/sync-catalog.mjs
        env:
          SYNC_DRY_RUN: "1"
          ADD_IMARAT_NEW: "0"
          ADD_BRAND_NEW: "0"
          ADD_ROUPAS: "0"
          ADD_FRANNY: "0"
          ADD_ACESSORIOS: "1"
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
      - name: Guardar snapshot de validação (artefato privado da execução)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dande-sync-dry-run-data
          path: js/data.js
          if-no-files-found: ignore
          retention-days: 1
