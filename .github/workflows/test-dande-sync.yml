name: Validacao isolada do sync (sem publicar catálogo)

on:
  pull_request:
    branches:
      - main
      - security/legacy-brand-151-delina-resolution-20261110
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/dande-url.mjs"
      - "scripts/dande-url.test.mjs"
      - "scripts/dande-category-membership.test.mjs"
      - "scripts/dande-stock-pagination.test.mjs"
      - "js/dande-category-membership.mjs"
      - "js/app.js"
      - "js/cart-identity.mjs"
      - "scripts/cart-identity.test.mjs"
      - "scripts/public-catalog.mjs"
      - "scripts/public-catalog.test.mjs"
      - "scripts/variation-stock.test.mjs"
      - "netlify/functions/dande-stock.mjs"
      - "netlify/functions/roupas-stock.mjs"
      - "scripts/variation-stock.test.mjs"
      - ".github/workflows/test-dande-sync.yml"

permissions:
  contents: read

jobs:
  dry-run-sync:
    name: Sincronização real sem publicar no Gist
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código da branch
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe e URLs Dande
        run: |
          node --check scripts/sync-catalog.mjs
          node --check scripts/dande-url.mjs
          node --check netlify/functions/roupas-stock.mjs
          node --check js/dande-category-membership.mjs
          node --test scripts/dande-url.test.mjs scripts/dande-category-membership.test.mjs scripts/dande-stock-pagination.test.mjs scripts/cart-identity.test.mjs scripts/public-catalog.test.mjs scripts/variation-stock.test.mjs
      - name: Executar sincronização em modo isolado
        run: node scripts/sync-catalog.mjs
        env:
          SYNC_DRY_RUN: "1"
          SYNC_DANDE_ONLY: "1"
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
