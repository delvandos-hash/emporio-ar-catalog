name: Limpar duplicatas do catálogo

on:
  workflow_dispatch:

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install @netlify/blobs
      - name: Rodar limpeza de duplicatas
        run: node scripts/limpar-duplicatas.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
