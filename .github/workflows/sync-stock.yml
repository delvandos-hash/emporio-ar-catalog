name: Sync catálogo (estoque + novos produtos)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-stock.yml"
      - "scripts/sync-catalog.mjs"
      - "scripts/public-catalog.mjs"
      - "scripts/restore-gist-only-legacy.mjs"
  schedule:
    # 08:00 e 20:00 horário de Brasília (UTC-3) → 11:00 e 23:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      restore_previous_catalog:
        description: "(Opcional) Restaurar public_ids a partir do snapshot conhecido da execução 42874130855."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "(Opcional) Só simular — não grava Gist nem data.js."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Agenda e execução manual publicam no Gist por padrão.
      # Push na main continua em dry-run (evita gravar a cada commit).
      # Manual: marque dry_run=true apenas para testar sem gravar.
      SYNC_DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Baixar snapshot conhecido anterior à remoção
        if: github.event_name == 'workflow_dispatch' && inputs.restore_previous_catalog == true
        uses: actions/download-artifact@v4
        with:
          name: full-reconcile-data-js-42874130855
          run-id: 42874130855
          github-token: ${{ github.token }}
          path: /tmp/catalog-baseline

      - name: Restaurar public_ids ausentes do snapshot conhecido
        if: github.event_name == 'workflow_dispatch' && inputs.restore_previous_catalog == true
        run: node scripts/restore-catalog-baseline.mjs
        env:
          CATALOG_BASELINE_PATH: /tmp/catalog-baseline/data.js

      - name: Testar sanitização, identidade e recuperação legada
        run: |
          node --check scripts/restore-gist-only-legacy.mjs
          node --test scripts/public-image-url.test.mjs scripts/public-catalog.test.mjs scripts/imarat-image-url.test.mjs scripts/imarat-source-guard.test.mjs scripts/additive-reconciliation.test.mjs scripts/legacy-restore-identity.test.mjs scripts/source-preservation.test.mjs scripts/sync-stock-source-guard.test.mjs scripts/catalog-baseline-restore.test.mjs
        env:
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}

      - name: Restaurar registros legados do Gist antes da sincronização
        run: node scripts/restore-gist-only-legacy.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Validar reconciliação aditiva antes da publicação
        run: |
          node scripts/audit-imarat-all-products.mjs | tee /tmp/preflight-audit.log
          grep -q 'ADDITIVE_RECONCILIATION_SAFE=true' /tmp/preflight-audit.log
          node scripts/apply-additive-reconciliation.mjs | tee /tmp/preflight-apply.log
          grep -Eq 'ADDITIVE_RECONCILIATION_(DRY_RUN|NOOP)=true' /tmp/preflight-apply.log
          echo "ALLOW_SAFE_ADDITIVE_BASELINE=1" >> "$GITHUB_ENV"
          echo "Preflight aprovado: reconciliação aditiva simulada." >> "$GITHUB_STEP_SUMMARY"
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          CATALOG_BASELINE_PATH: ${{ inputs.restore_previous_catalog == true && '/tmp/catalog-baseline/data.js' || '' }}

      - name: Sincronizar estoque e novos produtos
        run: node scripts/sync-catalog.mjs
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
          SYNC_IMARAT_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
          CATALOG_BASELINE_RESTORE: ${{ inputs.restore_previous_catalog == true && '1' || '0' }}
          ADD_BRAND_NEW: ${{ github.event_name == 'push' && '0' || '1' }}
          ADD_ROUPAS: ${{ github.event_name == 'push' && '0' || '1' }}
          ADD_FRANNY: ${{ github.event_name == 'push' && '0' || '1' }}
          ADD_ACESSORIOS: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Persistir data.js após sincronização bem-sucedida
        if: github.event_name != 'push' && env.SYNC_DRY_RUN == '0'
        run: |
          if git diff --quiet -- js/data.js; then
            echo "data.js já está atualizado; nenhum commit necessário."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "chore: persist synchronized catalog data"
          git push origin HEAD:main

      - name: Sincronizar estoque (apenas disponibilidade)
        if: github.event_name != 'push' && env.SYNC_DRY_RUN == '0'
        run: node scripts/sync-stock.mjs
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
