name: Sync catálogo (estoque + novos produtos)

on:
  # Gatilho temporário para aplicar a normalização possessiva no catálogo de produção.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-stock.yml"
  schedule:
    # 08:00 e 20:00 horário de Brasília (UTC-3) → 11:00 e 23:00 UTC
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar sanitização do catálogo público
        run: node --test scripts/public-image-url.test.mjs scripts/public-catalog.test.mjs scripts/imarat-image-url.test.mjs scripts/imarat-source-guard.test.mjs
        env:
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
      - name: Sincronizar estoque e novos produtos
        run: node scripts/sync-catalog.mjs
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
      - name: Sincronizar estoque (apenas disponibilidade)
        run: node scripts/sync-stock.mjs
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
