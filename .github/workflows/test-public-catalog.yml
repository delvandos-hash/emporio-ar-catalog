name: Testes de segurança do catálogo público

on:
  pull_request:
    branches:
      - main
      - security/public-catalog-sanitization
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  public-catalog-tests:
    name: Testes isolados do catálogo público
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar testes de sanitização e preservação
        run: |
          node --check scripts/sync-catalog.mjs
          node --check scripts/sync-stock.mjs
          node --check scripts/catalog-baseline-restore.mjs
          node --check scripts/restore-catalog-baseline.mjs
          node --check netlify/functions/stock-sync.js
          node --test scripts/stock-sync.test.mjs scripts/public-image-url.test.mjs scripts/public-catalog.test.mjs scripts/product-image-function.test.mjs scripts/get-feed.test.mjs scripts/favorites-compat.test.mjs scripts/product-share.test.mjs scripts/audit-catalog-match.test.mjs scripts/legacy-public-exclusions.test.mjs scripts/legacy-restore-identity.test.mjs scripts/additive-reconciliation.test.mjs scripts/source-preservation.test.mjs scripts/sync-stock-source-guard.test.mjs scripts/catalog-baseline-restore.test.mjs scripts/imarat-source-guard.test.mjs
      - name: Baixar snapshot conhecido para teste de recuperação real
        uses: actions/download-artifact@v4
        with:
          name: full-reconcile-data-js-42874130855
          run-id: 42874130855
          github-token: ${{ github.token }}
          path: /tmp/catalog-baseline-fixture
      - name: Validar recuperação contra o snapshot real anterior
        run: |
          cp js/data.js /tmp/catalog-current-fixture.js
          CATALOG_BASELINE_PATH=/tmp/catalog-baseline-fixture/data.js CATALOG_CURRENT_DATA_PATH=/tmp/catalog-current-fixture.js node scripts/restore-catalog-baseline.mjs | tee /tmp/catalog-baseline-restore.log
          grep -q 'KNOWN_GOOD_BASELINE_PUBLIC_IDS=2158' /tmp/catalog-baseline-restore.log
          # Estes dois rekeys são esperados: correspondência exata de stock_ref, linha, marca, categoria, nome e volume com o snapshot histórico.
          # O primeiro também deve preservar o preço manual gravado no snapshot.
          grep -q 'KNOWN_GOOD_BASELINE_REKEYED=2' /tmp/catalog-baseline-restore.log
          grep -Fq 'KNOWN_GOOD_BASELINE_REKEYED_ITEM={"from":"p_075346921b81acf67035","to":"p_20e409077acd20a85763","nome":"Blusa Basic Listrada","stock_ref":"s_691b8048fb460611e4cb2c71"}' /tmp/catalog-baseline-restore.log
          grep -Fq 'KNOWN_GOOD_BASELINE_REKEYED_ITEM={"from":"p_c1832958ed5fa7d1e246","to":"p_2b703ae3426fb7ecb19e","nome":"Body Luísa (suplex Premium)010","stock_ref":"s_fd59d9f422af86330366c0a8"}' /tmp/catalog-baseline-restore.log
          grep -q 'KNOWN_GOOD_BASELINE_AMBIGUOUS_STOCK_REFS=0' /tmp/catalog-baseline-restore.log
          grep -Eq 'KNOWN_GOOD_BASELINE_RESTORED=[0-9]+' /tmp/catalog-baseline-restore.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { collectPublicIds, parseDataJsContent } from './scripts/catalog-baseline-restore.mjs';
          const baseline = parseDataJsContent(fs.readFileSync('/tmp/catalog-baseline-fixture/data.js', 'utf8'));
          const current = parseDataJsContent(fs.readFileSync('/tmp/catalog-current-fixture.js', 'utf8'));
          const missing = [...collectPublicIds(baseline)].filter(id => !collectPublicIds(current).has(id));
          if (missing.length) throw new Error(`Snapshot conhecido ainda tem ${missing.length} public_ids ausentes após restauração.`);
          console.log(`SNAPSHOT_PUBLIC_IDS_PRESERVED=${collectPublicIds(baseline).size}`);
          NODE

