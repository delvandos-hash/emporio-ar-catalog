name: Auditoria somente leitura — todos os produtos Imarat

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-miniaturas-imarat.mjs"
      - "scripts/audit-imarat-all-products.mjs"
      - "scripts/audit-imarat-titles.mjs"
      - "scripts/sync-catalog.mjs"
      - ".github/workflows/audit-miniaturas-imarat.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit-miniaturas-imarat.mjs"
      - "scripts/audit-imarat-all-products.mjs"
      - "scripts/audit-imarat-titles.mjs"
      - "scripts/sync-catalog.mjs"
      - ".github/workflows/audit-miniaturas-imarat.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync catálogo (estoque + novos produtos)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  audit-miniaturas:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Auditar duplicidades de todos os produtos Imarat (somente leitura)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
        run: node scripts/audit-imarat-all-products.mjs
      - name: Comparar títulos do catálogo com o site raiz Imarat (somente leitura)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
        run: node scripts/audit-imarat-titles.mjs
      - name: Auditar miniaturas e regras de preço (somente leitura)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
        run: node scripts/audit-miniaturas-imarat.mjs
