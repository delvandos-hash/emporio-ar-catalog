name: Reconciliação completa em dry-run (sem publicar)

on:
  push:
    branches: [fix/reconciliation-mainline-identity-safe-20261109, security/pr77-brand-safe-stock-match, main]
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/audit-imarat-all-products.mjs"
      - "scripts/restore-gist-only-legacy.mjs"
      - "scripts/legacy-restore-identity.mjs"
      - "scripts/legacy-restore-identity.test.mjs"
      - "scripts/apply-additive-reconciliation.mjs"
      - "scripts/public-catalog.mjs"
      - "scripts/public-catalog.test.mjs"
      - "scripts/legacy-restore-identity.test.mjs"
      - "scripts/catalog-identity.mjs"
      - "scripts/catalog-identity.test.mjs"
      - "scripts/imarat-source-guard.test.mjs"
      - "scripts/additive-reconciliation.test.mjs"
      - "js/app.js"
      - ".github/workflows/full-reconcile-dry-run.yml"
      - ".github/workflows/sync-stock.yml"
permissions:
  contents: write

concurrency:
  group: full-reconcile-dry-run-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.head_ref == 'fix/reconciliation-mainline-identity-safe-20261109' || github.ref_name == 'fix/reconciliation-mainline-identity-safe-20261109' || github.ref_name == 'security/pr77-brand-safe-stock-match' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar branch de correção
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe e testes
        run: |
          node --check scripts/sync-catalog.mjs
          node --check scripts/restore-gist-only-legacy.mjs
          node --check scripts/legacy-restore-identity.mjs
          node --check scripts/apply-additive-reconciliation.mjs
          node --check scripts/public-catalog.mjs
          node --check scripts/catalog-identity.mjs
          node --check js/app.js
          node --test scripts/imarat-source-guard.test.mjs scripts/additive-reconciliation.test.mjs scripts/catalog-identity.test.mjs scripts/public-catalog.test.mjs scripts/legacy-restore-identity.test.mjs
      - name: Restaurar Gist legado antes do sincronizador (append-only)
        run: node scripts/restore-gist-only-legacy.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      - name: Gerar snapshot interno e atualizar somente Imarat
        run: node scripts/sync-catalog.mjs
        env:
          SYNC_DRY_RUN: "1"
          SYNC_SKIP_DETAILS: "1"
          SYNC_IMARAT_ONLY: "1"
          SYNC_DANDE_ONLY: "0"
          ADD_IMARAT_NEW: "1"
          ADD_BRAND_NEW: "0"
          ADD_ROUPAS: "0"
          ADD_FRANNY: "0"
          ADD_ACESSORIOS: "0"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
      - name: Restaurar itens legados ainda existentes no Gist
        run: node scripts/restore-gist-only-legacy.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      - name: Auditar snapshot gerado contra Gist (somente leitura)
        run: |
          node scripts/audit-imarat-all-products.mjs | tee /tmp/reconcile-audit.log
          if grep -q 'ADDITIVE_RECONCILIATION_SAFE=true' /tmp/reconcile-audit.log; then
            echo "BASELINE_OK=true" >> "$GITHUB_ENV"
            echo "Reconciliação aditiva validada: nenhum item do Gist será removido e todos os novos itens têm origem confirmada." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BASELINE_OK=false" >> "$GITHUB_ENV"
            echo "Reconciliação aditiva não validada; nenhum commit será feito." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
      - name: Simular publicação aditiva sem gravar no Gist
        if: env.BASELINE_OK == 'true'
        run: node scripts/apply-additive-reconciliation.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      - name: Guardar snapshot para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reconcile-data-js-${{ github.run_id }}
          path: js/data.js
          retention-days: 7
      - name: Persistir snapshot reconciliado somente se baseline passar
        if: env.BASELINE_OK == 'true' && github.event_name == 'push' && env.PERSIST_RECONCILED_SNAPSHOT == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração em data.js para registrar."
            exit 0
          fi
          git commit -m "chore: reconcile internal catalog with live sources"
          git push origin HEAD:${{ github.ref_name }}
