name: Validar publicação pública isolada

on:
  pull_request:
    paths:
      - 'scripts/publish-public-catalog.mjs'
      - 'scripts/publish-public-catalog.test.mjs'
      - 'scripts/public-catalog.mjs'
      - 'scripts/public-image-url.mjs'
      - 'netlify/functions/get-catalog.mjs'
      - 'netlify/functions/product-image.mjs'
      - 'netlify/functions/get-feed.js'
      - 'netlify/functions/roupas-stock.mjs'
      - 'netlify/functions/dande-stock.mjs'
      - 'scripts/get-feed.test.mjs'
      - 'scripts/favorites-compat.test.mjs'
      - 'js/favorites.js'
      - 'js/app.js'
      - 'js/data.js'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Escolha publicar o snapshot sanitizado ou executar apenas dry-run'
        required: true
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar preparação isolada do catálogo público
        env:
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
        run: |
          node --check js/app.js
          node --check netlify/functions/roupas-stock.mjs
          node --check netlify/functions/dande-stock.mjs
          node --test scripts/public-image-url.test.mjs scripts/public-catalog.test.mjs scripts/product-image-function.test.mjs scripts/get-feed.test.mjs scripts/favorites-compat.test.mjs scripts/publish-public-catalog.test.mjs
      - name: Executar dry-run sem publicar no Gist
        if: github.event_name == 'pull_request' || inputs.publish != 'publish'
        env:
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
        run: node scripts/publish-public-catalog.mjs
      - name: Publicar snapshot sanitizado no Gist
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'publish'
        env:
          ALLOW_PUBLIC_GIST_WRITE: yes
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
        run: node scripts/publish-public-catalog.mjs --publish
