name: Reconciliação de todas as fontes (dry-run, sem publicar)

on:
  push:
    branches: [security/source-identity-dedupe-20261109]
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/catalog-identity.mjs"
      - "scripts/catalog-identity.test.mjs"
      - "scripts/audit-imarat-all-products.mjs"
      - "scripts/dande-url.mjs"
      - "scripts/dande-url.test.mjs"
      - "scripts/source-identity-dedupe.mjs"
      - "scripts/legacy-restore-identity.mjs"
      - "scripts/legacy-restore-identity.test.mjs"
      - "scripts/restore-gist-only-legacy.mjs"
      - "scripts/brand-image-extraction.mjs"
      - "scripts/brand-image-extraction.test.mjs"
      - ".github/workflows/source-reconcile-dry-run.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/source-identity-dedupe.mjs"
      - "scripts/source-identity-dedupe.test.mjs"
      - "scripts/legacy-restore-identity.mjs"
      - "scripts/legacy-restore-identity.test.mjs"
      - "scripts/restore-gist-only-legacy.mjs"
      - "scripts/brand-image-extraction.mjs"
      - "scripts/brand-image-extraction.test.mjs"
      - ".github/workflows/source-reconcile-dry-run.yml"

permissions:
  contents: read

concurrency:
  group: source-reconcile-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar branch de homologação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe e identidade
        run: |
          node --check scripts/sync-catalog.mjs
          node --check scripts/dande-url.mjs
          node --check scripts/source-identity-dedupe.mjs
          node --check scripts/legacy-restore-identity.mjs
          node --check scripts/restore-gist-only-legacy.mjs
          node --check scripts/brand-image-extraction.mjs
          node --test scripts/catalog-identity.test.mjs scripts/source-identity-dedupe.test.mjs scripts/dande-url.test.mjs scripts/legacy-restore-identity.test.mjs scripts/brand-image-extraction.test.mjs
      - name: Sincronizar todas as fontes sem publicar
        run: node scripts/sync-catalog.mjs
        env:
          SYNC_DRY_RUN: "1"
          SYNC_SKIP_DETAILS: "1"
          SYNC_IMARAT_ONLY: "0"
          SYNC_DANDE_ONLY: "0"
          ADD_IMARAT_NEW: "1"
          ADD_BRAND_NEW: "1"
          ADD_ROUPAS: "1"
          ADD_FRANNY: "1"
          ADD_ACESSORIOS: "1"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}

      - name: Preservar itens públicos legados no snapshot após a sincronização (sem publicar)
        run: node scripts/restore-gist-only-legacy.mjs
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Auditar snapshot reconciliado contra o Gist (somente leitura)
        run: |
          node scripts/audit-imarat-all-products.mjs | tee /tmp/source-reconcile-audit.log
          if ! grep -q 'ADDITIVE_RECONCILIATION_SAFE=true' /tmp/source-reconcile-audit.log; then
            echo "Reconciliação não aprovada: há itens sem correspondência inequívoca ou divergência no baseline." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "ADDITIVE_RECONCILIATION_SAFE=true" >> "$GITHUB_STEP_SUMMARY"
          echo "O snapshot restaurado foi comparado com o Gist em modo somente leitura; nenhuma publicação foi feita." >> "$GITHUB_STEP_SUMMARY"
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}

      - name: Guardar snapshot reconciliado para inspeção
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: source-reconcile-data-js-${{ github.run_id }}
          path: js/data.js
          retention-days: 7
