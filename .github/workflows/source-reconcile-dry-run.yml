name: Reconciliação de todas as fontes (dry-run, sem publicar)

on:
  push:
    branches: [security/source-identity-dedupe-20261109]
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/source-identity-dedupe.mjs"
      - ".github/workflows/source-reconcile-dry-run.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/sync-catalog.mjs"
      - "scripts/source-identity-dedupe.mjs"
      - "scripts/source-identity-dedupe.test.mjs"
      - "scripts/catalog-baseline-restore.mjs"
      - "scripts/catalog-baseline-restore.test.mjs"
      - "scripts/restore-catalog-baseline.mjs"
      - ".github/workflows/source-reconcile-dry-run.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: source-reconcile-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar branch de homologação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxe e identidade
        run: |
          node --check scripts/sync-catalog.mjs
          node --check scripts/source-identity-dedupe.mjs
          node --check scripts/catalog-baseline-restore.mjs
          node --check scripts/restore-catalog-baseline.mjs
          node --test scripts/catalog-identity.test.mjs scripts/source-identity-dedupe.test.mjs scripts/catalog-baseline-restore.test.mjs
      - name: Baixar snapshot anterior conhecido para reconciliação
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: full-reconcile-data-js-42874130855
          run-id: 42874130855
          github-token: ${{ github.token }}
          path: /tmp/catalog-baseline
      - name: Restaurar IDs públicos do snapshot conhecido
        if: github.event_name == 'pull_request'
        run: node scripts/restore-catalog-baseline.mjs
        env:
          CATALOG_BASELINE_PATH: /tmp/catalog-baseline/data.js
      - name: Sincronizar todas as fontes sem publicar
        run: node scripts/sync-catalog.mjs
        env:
          SYNC_DRY_RUN: "1"
          CATALOG_BASELINE_RESTORE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          SYNC_SKIP_DETAILS: "1"
          SYNC_IMARAT_ONLY: "0"
          SYNC_DANDE_ONLY: "0"
          ADD_IMARAT_NEW: "1"
          ADD_BRAND_NEW: "1"
          ADD_ROUPAS: "1"
          ADD_FRANNY: "1"
          ADD_ACESSORIOS: "1"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IMARAT_API_URL: ${{ secrets.IMARAT_API_URL }}
          IMARAT_ORIGIN_URL: ${{ secrets.IMARAT_ORIGIN_URL }}
          BRAND_BASE_URL: ${{ secrets.BRAND_BASE_URL }}
          CDN_IMAGE_BASE_URL: ${{ secrets.CDN_IMAGE_BASE_URL }}
          CDN_IMAGE_FALLBACK_BASE_URL: ${{ secrets.CDN_IMAGE_FALLBACK_BASE_URL }}
          SOPHIA_PRIMARY_URL: ${{ secrets.SOPHIA_PRIMARY_URL }}
          SOPHIA_FALLBACK_URL: ${{ secrets.SOPHIA_FALLBACK_URL }}
          SOPHIA_FALLBACK_ORIGIN: ${{ secrets.SOPHIA_FALLBACK_ORIGIN }}
          FRANNY_BASE_URL: ${{ secrets.FRANNY_BASE_URL }}
          DANDE_BASE_URL: ${{ secrets.DANDE_BASE_URL }}
      - name: Confirmar que todos os IDs do snapshot anterior sobreviveram ao sync
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { collectPublicIds, parseDataJsContent } from "./scripts/catalog-baseline-restore.mjs";
          const baseline = parseDataJsContent(fs.readFileSync("/tmp/catalog-baseline/data.js", "utf8"));
          const current = parseDataJsContent(fs.readFileSync("js/data.js", "utf8"));
          const baselineIds = collectPublicIds(baseline);
          const currentIds = collectPublicIds(current);
          const missing = [...baselineIds].filter(id => !currentIds.has(id));
          console.log(`BASELINE_PUBLIC_IDS_PRESERVED=${baselineIds.size - missing.length}/${baselineIds.size}`);
          console.log(`BASELINE_PUBLIC_IDS_MISSING=${missing.length}`);
          if (missing.length) {
            console.error("IDs do snapshot anterior ausentes após o dry-run: " + missing.join(","));
            process.exit(1);
          }
          NODE
