name: Sync catálogo (estoque + novos produtos)

on:
  schedule:
    - cron: '0 11,23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sincronizar estoque e novos produtos
        run: node scripts/sync-catalog.mjs
      - name: Commit se houver mudança
        run: |
          git config user.name "emporio-ar-bot"
          git config user.email "bot@emporioar.local"
          git add js/data.js
          if git diff --staged --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "chore: sync catálogo $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
